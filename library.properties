sentence=Lightweight non-blocking UART data synchronization between two boards (ESP32, Arduino UNO/Nano/Mega).
paragraph=Sends any user-defined struct periodically over a UART, with sync bytes, sequence counter and CRC16 frame checking. On ESP32 a background FreeRTOS task does the work; on AVR boards a non-blocking vUpdate() is called from loop().
